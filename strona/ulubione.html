<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ulubione nabory – Dotacjo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/brand/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#003D2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Ulubione nabory (osobna strona, wcześniej sekcja profilu): oś terminów, etap przygotowania jednym kliknięciem,
   notatka i eksport do kalendarza. Styl jak profil i strona główna. */
:root{
  --paper:#fbfcf8; --surface:#ffffff; --soft:#dce7df; --greenL:#e6f5ec;
  --ink:#050d09; --mut:#2c3a33; --line:#a9b9ae;
  --green:#006937; --deep:#003D2B; --accent:#08D568; --greenT:#004e2b; --red:#c23b22; --redL:#fbe9e5; --amber:#8a5a00; --amberL:#fbf3e2;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--font);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:var(--green)}
h1,h2,h3,h4{font-weight:800;line-height:1.15;letter-spacing:-.03em;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px/1 var(--font);padding:11px 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.ghost{background:var(--surface);border-color:#82958a;color:var(--ink)}
.btn.ghost:hover{border-color:var(--mut)}
.btn.link{background:none;border:0;padding:8px 4px;color:var(--mut);font-weight:600}
.btn.link:hover{color:var(--ink)}

header{position:sticky;top:0;z-index:20;background:rgba(251,252,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:16px;height:66px}
.logo{display:block;margin-right:auto;padding-block:4px}
.logo img{display:block;width:160px;height:auto}
@media (max-width:520px){.logo img{width:136px}}

main{padding-block:40px 80px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.hello h1{font-size:clamp(28px,4vw,38px)}
.hello p{color:var(--mut);margin-top:6px}
.banner{background:var(--greenL);color:var(--greenT);font-weight:600;border-radius:12px;padding:14px 18px;margin-bottom:20px}

.top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:40px}
@media (max-width:760px){.top{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.card .lbl{font-size:13px;font-weight:700;color:var(--green)}
.card h2{font-size:22px}
.card p{color:var(--mut);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--greenL);color:var(--greenT);width:max-content}
.pill.off{background:var(--soft);color:var(--mut)}
.pill.warn{background:var(--amberL);color:var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.settings{margin-top:40px}
.btn.danger{color:var(--red)}
.btn.danger-fill{background:var(--red);color:#fff}
.del{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.del label{font-size:14px;font-weight:700}
.del input{font:500 15px var(--font);padding:11px 12px;border:1px solid var(--line);border-radius:10px;width:100%}
.del .err{color:var(--red);font-size:14px}

.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec h2{font-size:26px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{font:600 13px/1 var(--font);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--mut);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters b{font-weight:700;margin-left:4px;opacity:.7}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:24px;bottom:24px;width:2px;background:var(--line)}
.ev{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev::before{content:"";position:absolute;left:-24px;top:30px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--green);box-sizing:border-box}
.date{background:var(--greenL);color:var(--greenT);border-radius:10px;text-align:center;padding:6px 0 5px;line-height:1}
.date small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.date b{display:block;font-size:22px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.date.open{padding:10px 0}
.date.open small{font-size:10px}
.ev h3{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.ev h3 a{color:inherit;text-decoration:none}
.ev h3 a:hover{text-decoration:underline}
.ev .sub{font-size:13px;color:var(--mut);margin-top:2px}
.ev .v{text-align:right;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .v small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.ev.hot::before{border-color:var(--red)}
.ev.hot .date{background:var(--redL);color:var(--red)}
.ev.hot .left{color:var(--red);font-weight:600}
.ev.done{opacity:.6}
.ev.done::before{border-color:#7a8b81}
.tools{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.tools select{font:600 13px/1 var(--font);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.tools .btn{padding:7px 10px;font-size:13px}
.note{grid-column:2/-1;margin-top:4px}
.note textarea{width:100%;min-height:70px;font:15px/1.5 var(--font);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.note p{font-size:14px;color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 12px;white-space:pre-wrap}
.empty{padding:28px 4px;color:var(--mut);display:grid;gap:12px;justify-items:start}
@media (max-width:560px){
  .list{padding:4px 14px}
  .ev{grid-template-columns:50px minmax(0,1fr)}
  .ev .v{grid-column:2;text-align:left}
  .ev .v small{display:inline;margin-left:6px}
}

.gate{max-width:520px;margin:40px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.gate p{color:var(--mut)}
footer{border-top:1px solid var(--line);padding-block:24px 32px;font-size:13px;color:var(--mut);background:var(--surface)}
footer a{color:var(--mut)}

.appnav{display:flex;gap:4px}
.appnav a{color:var(--mut);text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:8px}
.appnav a:hover{color:var(--ink);background:var(--soft)}
.appnav a[aria-current=page]{color:var(--greenT);background:var(--greenL)}
@media (max-width:520px){header .wrap{gap:6px}.logo img{width:104px!important}.appnav{gap:0}.appnav a{padding:8px 7px;font-size:13px}}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stages button{font:600 12.5px/1 var(--font);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--mut);cursor:pointer}
.stages button:hover{border-color:var(--mut);color:var(--ink)}
.stages button[aria-pressed=true]{background:var(--greenL);border-color:var(--greenL);color:var(--greenT)}
.gone{font-size:12px;font-weight:700;color:var(--mut);background:var(--soft);border-radius:6px;padding:2px 7px;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="/"><img src="/brand/svg/dotacjo-horizontal.svg" alt="Dotacjo" width="160" height="50"></a>
    <nav class="appnav" aria-label="Konto">
      <a href="/" id="searchLink">Wyszukiwarka</a>
      <a href="/ulubione" aria-current="page">Ulubione</a>
      <a href="/profil">Konto</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="gate" id="gate" hidden>
    <h1>Zaloguj się, żeby zobaczyć ulubione</h1>
    <p>Wyślemy Ci link do logowania na e-mail. Bez hasła.</p>
    <button type="button" class="btn primary" id="loginBtn">Zaloguj się</button>
  </div>

  <div id="app" hidden>
    <div class="hello">
      <div><h1>Ulubione nabory</h1><p>Zapisane nabory według terminu. Kliknij etap, żeby zaznaczyć, na czym stoisz.</p></div>
      <a class="btn ghost" id="icsBtn" href="/api/profile/favorites.ics" download>📅 Dodaj terminy do kalendarza</a>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filtruj według etapu"></div>
    <div class="list"><div class="tl" id="favs"></div></div>
  </div>
</main>

<footer><div class="wrap">© 2026 Dotacjo · <a href="/#faq">Pytania</a> · <a href="/#cennik">Cennik</a><a href="#" data-zgody hidden> · Ustawienia cookies</a></div></footer>

<script>
(function(){
  var MON=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
  var ST={nowy:"Zapisane",przygotowuje:"Przygotowuję wniosek",zlozony:"Wniosek złożony",pominiety:"Pomijam"};
  var TYPE={dotacja:"dotacja",pozyczka:"pożyczka",mieszane:"dotacja + pożyczka"};
  var today=new Date();today.setHours(0,0,0,0);
  var favs=[],filter="all",openNote=null;
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function zl(n){if(!n)return"";if(n>=1e6)return(Math.round(n/1e5)/10).toString().replace(".",",")+" mln zł";if(n>=1e3)return Math.round(n/1e3)+" tys. zł";return n+" zł"}
  function parse(iso){if(!iso)return null;var t=new Date(String(iso).slice(0,10)+"T00:00:00");return isNaN(t)?null:t}
  function api(path,method,body){return fetch(path,{method:method||"GET",credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
  // ---- ulubione ----
  function counts(){var c={all:favs.length};favs.forEach(function(f){c[f.status]=(c[f.status]||0)+1});return c}
  function drawFilters(){
    var c=counts(),opts=[["all","Wszystkie"]].concat(Object.keys(ST).map(function(k){return[k,ST[k]]}));
    $("filters").innerHTML=opts.map(function(o){return '<button type="button" data-f="'+o[0]+'" aria-pressed="'+(filter===o[0])+'">'+o[1]+'<b>'+(c[o[0]]||0)+'</b></button>'}).join("");
    $("filters").hidden=!favs.length;
    $("icsBtn").hidden=!favs.some(function(f){return parse(f.program.deadline)&&f.status!=="zlozony"&&f.status!=="pominiety"});
  }
  function byDate(a,b){var x=parse(a.program.deadline),y=parse(b.program.deadline);if(x&&y)return x-y;if(x)return-1;if(y)return 1;return b.savedAt-a.savedAt}
  function drawFavs(){
    drawFilters();
    var list=favs.filter(function(f){return filter==="all"||f.status===filter}).sort(byDate);
    if(!list.length){$("favs").innerHTML='<div class="empty">'+(favs.length?"<p>Brak naborów na tym etapie.</p>":
      '<p>Nie masz jeszcze ulubionych naborów. Przy każdym wyniku wyszukiwania kliknij „☆ Zapisz”, a program pojawi się tutaj razem z terminem.</p><a class="btn primary" href="/">Wyszukaj dotacje</a>')+'</div>';return}
    $("favs").innerHTML=list.map(function(f){
      var p=f.program,t=parse(p.deadline),n=t?Math.round((t-today)/864e5):null,done=f.status==="zlozony"||f.status==="pominiety";
      var hot=!done&&n!=null&&n<30;
      var date=t?'<div class="date"><small>'+MON[t.getMonth()]+'</small><b>'+t.getDate()+'</b></div>':'<div class="date open"><small>'+(p.status==="soon"?"wkrótce":"ciągły")+'</small></div>';
      var left=n==null?"":n<0?"nabór zakończony":n===0?"ostatni dzień":"zostało "+n+(n===1?" dzień":" dni");
      var name=p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>':esc(p.name);
      var sub=[esc(p.op||p.level||""),left?'<span class="left">'+left+'</span>':""].filter(Boolean).join(" · ");
      var sel='<div class="stages" role="group" aria-label="Etap">'+Object.keys(ST).map(function(k){return '<button type="button" data-st="'+esc(f.id)+'" data-v="'+k+'" aria-pressed="'+(k===f.status)+'">'+ST[k]+'</button>'}).join("")+'</div>';
      var editing=openNote===f.id;
      var note=editing?'<div class="note"><textarea data-note="'+esc(f.id)+'" placeholder="Np. potrzebne dokumenty, kontakt do doradcy, co już zrobione">'+esc(f.note)+'</textarea><div class="row"><button class="btn primary" type="button" data-save="'+esc(f.id)+'">Zapisz notatkę</button><button class="btn link" type="button" data-cancel>Anuluj</button></div></div>'
        :f.note?'<div class="note"><p>'+esc(f.note)+'</p></div>':"";
      return '<div class="ev'+(hot?" hot":"")+(done?" done":"")+'">'+date+'<div><h3>'+name+'</h3><p class="sub">'+sub+'</p></div><div class="v">'+esc(p.max?"do "+zl(p.max):"")+'<small>'+esc(TYPE[p.type]||"")+'</small></div>'+
        '<div class="tools">'+sel+'<button class="btn ghost" type="button" data-edit="'+esc(f.id)+'">'+(f.note?"Edytuj notatkę":"Dodaj notatkę")+'</button><button class="btn link" type="button" data-del="'+esc(f.id)+'">Usuń z ulubionych</button></div>'+note+'</div>';
    }).join("");
  }
  function find(id){for(var i=0;i<favs.length;i++)if(favs[i].id===id)return favs[i]}
  function enc(id){return encodeURIComponent(id)}
  $("filters").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;drawFavs()}});
  $("favs").addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.dataset.st){var f0=find(t.dataset.st);f0.status=t.dataset.v;api("/api/profile/favorites/"+enc(f0.id),"PUT",{status:t.dataset.v}).catch(function(){});drawFavs()}
    else if(t.dataset.edit){openNote=t.dataset.edit;drawFavs();var ta=document.querySelector("[data-note]");if(ta)ta.focus()}
    else if(t.hasAttribute("data-cancel")){openNote=null;drawFavs()}
    else if(t.dataset.save){var f=find(t.dataset.save),v=document.querySelector("[data-note]").value;f.note=v;openNote=null;api("/api/profile/favorites/"+enc(f.id),"PUT",{note:v}).catch(function(){});drawFavs()}
    else if(t.dataset.del){var id=t.dataset.del;favs=favs.filter(function(x){return x.id!==id});fetch("/api/profile/favorites/"+enc(id),{method:"DELETE",credentials:"same-origin"});drawFavs()}
  });

  $("loginBtn").onclick=function(){window.Konto&&Konto.login("/ulubione")};
  document.addEventListener("konto:ready",function(e){
    var me=e.detail||{};
    if(!me.user){$("gate").hidden=false;return}
    $("app").hidden=false;
    if(me.access&&me.access.active)$("searchLink").href="/panel";
    api("/api/profile/favorites").then(function(j){favs=j.favorites||[];drawFavs()}).catch(function(){favs=[];drawFavs()});
  });
})();
</script>
<script src="/konto.js"></script>
<script src="/zgody.js" defer></script>
<script src="/stat.js" defer></script>
</body>
</html>
