<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brak internetu – Dotacjo</title>
<meta name="theme-color" content="#003D2B">
<link rel="icon" href="/brand/icons/icon-192.png">
<style>
:root{--paper:#fbfcf8;--ink:#050d09;--mut:#2c3a33;--deep:#003D2B;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:380px;text-align:center}
img{width:150px;height:auto;margin-bottom:28px}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--mut);margin:0 0 24px}
button{font:inherit;font-weight:700;background:var(--deep);color:#fff;border:0;border-radius:12px;padding:14px 26px;cursor:pointer;width:100%}
</style>
</head>
<body>
<main>
  <img src="/brand/svg/dotacjo-horizontal.svg" alt="Dotacjo" width="150" height="47">
  <h1>Brak połączenia z internetem</h1>
  <p>Dotacjo pokazuje zawsze aktualne nabory, więc potrzebuje internetu. Sprawdź Wi‑Fi albo dane komórkowe i spróbuj ponownie.</p>
  <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
