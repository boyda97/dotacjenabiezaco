name: silnik

on:
  push:
    branches: [main]
    paths: ["silnik/**", ".github/workflows/silnik.yml"]
  pull_request:
    paths: ["silnik/**", ".github/workflows/silnik.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: silnik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
